<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var repo = '/MyPurchaser';
        var path = window.location.pathname;
        var route = path.indexOf(repo) === 0 ? path.substring(repo.length) : path;
        if (route.indexOf('/') === 0) {
          route = route.substring(1);
        }
        var target = repo + '/#' + (route ? '/' + route : '/') + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/MyPurchaser/">MyPurchaser</a>...</p>
  </body>
</html>
